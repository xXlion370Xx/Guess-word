<div class="person-list-container">
  <h2>Jugadores en sala</h2>
  <div class="person-list">
    @for (person of persons(); track $index) {
    <p> {{person}}</p>
    }
  </div>
  <div class="info-list">
    <p><b>Tu nombre:</b></p>
    {{this.userInfo?.user_name}}
    <p><b>ID SALA:</b></p>
    {{userInfo?.room_id}}
  </div>
</div>
